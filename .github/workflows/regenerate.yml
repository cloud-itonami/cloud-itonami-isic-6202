# Nightly regeneration -- rebuild docs/samples/operator-console.html through
# the REAL service-desk actor (svcdesk.render-html, driving
# svcdesk.operation/svcdesk.policy/svcdesk.store the same way svcdesk.sim
# does) and commit only when the rendered console actually changed. Closes
# flagship checklist item 2 (ADR-2607189300 at com-junkawasaki/root) for
# cloud-itonami-isic-6202: the wave5 fleet demo-generation sweep covers the
# 290-repo cluster but 6202 has an http.clj layer (different shape), so its
# demo was deferred -- this workflow + src/svcdesk/render_html.cljk are that
# entrypoint.
#
# JVM Clojure (clojure -M:dev:render-html), not nbb -- svcdesk.* + its
# kotoba-lang/{crm,langgraph,langchain} deps are JVM.
#
# NOTE: GitHub Actions is DISABLED at the repo level for gftdcojp/cloud-itonami
# (same as deploy.yml / nudge-scan.yml / isic-5820's regenerate.yml). This
# file is committed anyway so it runs the moment Actions is re-enabled; until
# then run `clojure -M:dev:render-html` from any scheduler (the generated
# HTML is checked in, so the page is current).
name: regenerate-console
on:
  schedule:
    - cron: '29 18 * * *'   # 03:29 JST nightly (off-minute on purpose)
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - name: Install clojure
        run: |
          curl -fsSL https://download.clojure.org/install/linux-install.sh | sudo bash
      - name: Restore clojure classpath cache
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: m2-render-html-${{ hashFiles('deps.edn') }}
      - name: Fetch sibling deps (west layout)
        run: |
          git clone --depth 1 https://github.com/kotoba-lang/crm.git ../../kotoba-lang/crm
          git clone --depth 1 https://github.com/kotoba-lang/langgraph.git ../../kotoba-lang/langgraph
          git clone --depth 1 https://github.com/kotoba-lang/langchain.git ../../kotoba-lang/langchain
      - name: Regenerate operator-console.html
        run: clojure -M:dev:render-html
      - name: Commit only on change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          if git diff --quiet docs/samples/operator-console.html; then
            echo "console unchanged"
          else
            git add docs/samples/operator-console.html
            git commit -m "chore(docs): regenerate 6202 operator-console.html (svcdesk.render-html)"
            git push
          fi
